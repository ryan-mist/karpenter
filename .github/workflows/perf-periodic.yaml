name: perf-periodic
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf-periodic:
    if: github.event_name != 'schedule' || github.repository == 'kubernetes-sigs/karpenter'
    strategy:
      fail-fast: false
      matrix:
        # Scenarios migrated from perfv1 run here rather than in perf-smoke, as perfv1 ran after merge and not per PR.
        scenario:
          - pods
          - nodepools
          - topology
          - drift
          - doNotDisrupt
          - hostnameSpread
          - interference
          - wideDeployments
          - diverseNodePools
          - targetedNodePools
          - balancedBasic
          - balancedChurn
          - balancedHeterogeneous
        run: [1, 2, 3]
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Performancev2
      focus: ${{ matrix.scenario }}
      test_name: perf-periodic ${{ matrix.scenario }} ${{ matrix.run }}
      perf_env: KARPENTER_PERF_PROVIDER=kwok-ci
      retention_days: 90
